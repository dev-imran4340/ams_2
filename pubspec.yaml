name: ams_2
description: "A new Flutter project for AMS 2."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  get_storage: ^2.1.1
  flutter_screenutil: ^5.9.3
  http: ^1.6.0
  flutter_svg: ^2.3.0
  cached_network_image: ^4.0.0
  connectivity_plus: ^7.3.1
  flutter_spinkit: ^5.2.2
  fluttertoast: ^10.0.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.2
  top_snackbar_flutter: ^3.4.0
  device_info_plus: ^13.3.0
  path_provider: ^2.1.6
  animated_custom_dropdown: ^4.0.0
  mobile_scanner: ^7.4.2
  camera: ^0.12.1
  open_filex: ^5.0.0
  qr_flutter: ^4.1.0
  pdf: ^3.13.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3
  google_mlkit_face_detection: ^0.15.1
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/svgs/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_24pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_24pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_24pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_24pt-Bold.ttf
          weight: 700
